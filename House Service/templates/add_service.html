{% extends 'admin_dashboard.html' %}

{% block content %}
<div class="container border border-primary m-5 rounded">
    <div class="justify-content-center">
        <p class="h4 text-info text-center m-2">
            Add Service
        </p>
    </div>
    <div class="row m-2">
        <form action="{{ url_for('addService')}}" method="post">
            <div class="mb-3">
                <label for="sname" class="form-label">Service Name:</label>
                <input type="text" class="form-control" name="sname" id="sname" placeholder="EX: kitchen Cleaning" required>
            </div>
            <div class="mb-3">
                <label for="price" class="form-label">Price :</label>
                <input type="number" class="form-control" name="price" id="price" placeholder="EX: 100" required>
            </div>
            <div class="mb-3">
                <label for="t_required" class="form-label">Time Required :</label>
                <input type="number" class="form-control" name="t_required" id="t_required" placeholder="In Hour" required>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description :</label>
                <textarea class="form-control" id="description" name="sdesc" rows="3" ></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Add Service</button>
            <a href="{{ url_for('adminDashboard') }}" class="btn btn-outline-primary"> Cancel</a>
        </form>
    </div>
    <div class="justify-content-center">
        <p class="text-info text-center h5">{{ msg }}</p>
    </div>
</div>
    
{% endblock content %}
