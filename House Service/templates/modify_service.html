{% extends 'admin_dashboard.html' %}
{% block content %}
<div class="container border border-primary m-5 rounded">
    <div class="justify-content-center">
        <p class="h4 text-info text-center m-2">
            Update Service
        </p>
    </div>
    <div class="row m-2">
        <form action="{{ url_for('del_mod_service',task='modify',id =ser.id)}}" method="post">
            <div class="mb-3">
                <label for="sid" class="form-label">Service Id:</label>
                <input type="text" class="form-control" name="sid" id="sid" value='{{ ser.id }}' disabled>
            </div>
            <div class="mb-3">
                <label for="sname" class="form-label">Service Name:</label>
                <input type="text" class="form-control" name="sname" id="sname" value='{{ ser.name }}' required>
            </div>
            <div class="mb-3">
                <label for="price" class="form-label">Price :</label>
                <input type="number" class="form-control" name="price" id="price" value='{{ ser.price }}' required>
            </div>
            <div class="mb-3">
                <label for="t_required" class="form-label">Time Required :</label>
                <input type="number" class="form-control" name="t_required" id="t_required" value='{{ ser.time_required }}' required>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">Description :</label>
                <textarea class="form-control" id="description" name="sdesc"  rows="3" >{{ ser.description }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">Update Service</button>
            <a href="{{ url_for('adminDashboard') }}" class="btn btn-outline-primary"> Cancel</a>
        </form>
    </div>
</div>
    
{% endblock content %}
