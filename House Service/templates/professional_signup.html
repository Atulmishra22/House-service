<!DOCTYPE html>
<html lang="en">
<head>
    <title>professional:sign up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #fff;
        }
        .form-label {
            font-size: 16px;
            font-weight: bold;
        }
        .form-control {
            border: 2px solid #000;
            border-radius: 10px;
        }
        .form-select {
            border: 2px solid #000;
            border-radius: 10px;
        }
        .file-upload {
            background-color: #f8d7da;
            border: 2px solid #000;
            border-radius: 10px;
            padding: 5px 10px;
            cursor: pointer;
        }
        .file-upload:hover {
            background-color: #f5c6cb;
        }
        .btn-register {
            background-color: #007bff;
            color: #fff;
            border-radius: 10px;
            padding: 10px 20px;
            font-size: 18px;
        }
        .btn-register:hover {
            background-color: #0056b3;
        }
        .login-link {
            color: #ff4500;
            text-align: center;
            display: block;
            margin-top: 10px;
            font-size: 16px;
        }
        .title {
            font-size: 24px;
            color: #4169e1;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Service Professional Signup</div>
        <form action="{{ url_for('register', registerer='professional') }}" method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="email" class="form-label">Email ID(Username) :</label>
                <input type="email" class="form-control" name="email" id="email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password :</label>
                <input type="password" class="form-control" name="pwd" id="password" required>
            </div>
            <div class="mb-3">
                <label for="fullname" class="form-label">Fullname :</label>
                <input type="text" class="form-control" name="name" id="fullname" required>
            </div>
            <div class="mb-3">
                <label for="service" class="form-label">Service Name :</label>
                <select class="form-select" name="service" id="service" required>
                    <option selected>select available services</option>
                    <option value="1">Service 1</option>
                    <option value="2">Service 2</option>
                    <option value="3">Service 3</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="experience" class="form-label">Experience(in yrs) :</label>
                <input type="number" class="form-control" name="exp" id="experience" required>
            </div>
            <div class="mb-3">
                <label for="documents" class="form-label">Attach documents :<br>(single pdf)</label>
                <input type="file" class="form-control file-upload" name="doc" id="documents" accept="application/pdf" required>
            </div>
            <div class="mb-3">
                <label for="address" class="form-label">Address :</label>
                <textarea class="form-control" name="address" id="address" rows="3" required></textarea>
            </div>
            <div class="mb-3">
                <label for="pincode" class="form-label">Pin Code :</label>
                <input type="text" class="form-control" name="pincode" id="pincode" required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-register">Register</button>
            </div>
            <a href="{{ url_for('login') }}" class="login-link text-decoration-none">Login here</a>
        </form>
    </div>
</body>
</html>
