<!DOCTYPE html>
<html lang="en">
<head>
    <title>Customer Signup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        
        .container{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f8f9fa;
        }
        .signup-form {
            border: 2px solid #000;
            border-radius: 10px;
            padding: 20px;
            background-color: #fff;
            width: 400px;
        }
        .signup-form h2 {
            text-align: center;
            color: #1a73e8;
            margin-bottom: 20px;
        }
        .signup-form label {
            font-weight: bold;
        }
        .signup-form .form-control {
            border: 2px solid #000;
            border-radius: 10px;
        }
        .signup-form .btn-primary {
            background-color: #1a73e8;
            border: none;
            border-radius: 10px;
            width: 100%;
        }
        .signup-form .login-link {
            text-align: center;
            margin-top: 10px;
            color: #ff8c00;
        }
    </style>
</head>
<body>
    <nav class="navbar bg-primary" id="Navbar">
        <div class="col container-lg nav-items">
          <a href="{{ url_for('home') }}" class="text-decoration-none">
            <h1 class="fw-muted text-white">House Service</h1>
          </a>
        </div>
    </nav>   
    <!-- Sign Up Form -->
    <div class="container">
        <div class="signup-form">
            <h2>Customer Signup</h2>
            <form action="{{ url_for('register',registerer= 'customer')}}" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label">Email ID(Username) :</label>
                    <input type="email" class="form-control" name="email" id="email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password :</label>
                    <input type="password" class="form-control" name="pwd" id="password" required>
                </div>
                <div class="mb-3">
                    <label for="fullname" class="form-label">Fullname :</label>
                    <input type="text" class="form-control" name="name" id="fullname" required>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">Phone :</label>
                    <input type="text" class="form-control" name="phone" id="phone" required>
                </div>
                <div class="mb-3">
                    <label for="address" class="form-label">Address :</label>
                    <textarea class="form-control" id="address" name="address" rows="3" required></textarea>
                </div>
                <div class="mb-3">
                    <label for="pincode" class="form-label">Pin Code :</label>
                    <input type="text" class="form-control" name="pin" id="pincode" required>
                </div>
                <button type="submit" class="btn btn-primary">Register</button>
                <div class="login-link">
                    <a href="{{ url_for('login') }}" class="text-decoration-none">Login here</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
