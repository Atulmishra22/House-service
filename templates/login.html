<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css')}}">
</head>
<body>
    <nav class="navbar bg-primary" id="Navbar">
        <div class="col container-lg nav-items">
          <a href="{{ url_for('home') }}" class="text-decoration-none"
            ><h1 class="fw-muted text-white">House Service</h1>
          </a>
          <h2 class="text-white">Login form</h2>
        </div>
    </nav>
    <div class="container">
        <div class="h-image">
            <img class="house" src="{{ url_for('static', filename='images/houseservice.png')}}" alt="">
        </div>
        <form action="{{ url_for('login', msg = ' ') }}" method="post" class="outer">
            <div>
                <label for="select_user" id="select_user" class="h4">Select User:</label>
                <select id="select_user" name="user" class="border border-primary rounded ms-3 p-2 h5 " >
                    <option value="Admin">Admin</option>
                    <option value="Customer">Customer</option>
                    <option value="Professional">Professional</option>
                </select>
            </div>
            <label class="title_head" for="email">Email</label>
            <input class="inputarea" type="email" name="usr_name" id="email" placeholder="Enter your email" required>
            
            <label for="password" class="title_head">Password</label>
            <input type="password" name="pass" id="password" placeholder="password"  required>
            
            <button type="submit">Login</button>
            <div class="external">    
                <a href={{ url_for('register', registerer='professional') }}>Create account:Professional</a>
                <a href={{ url_for('register', registerer='customer') }}>Create account:Customer</a> 
                <div class="conatiner-lg bg-warning">
                    <p class="text-center h5">{{ msg }}</p>
                </div> 
            </div>  
        </form>
        
    </div>
    
</body>
</html>
